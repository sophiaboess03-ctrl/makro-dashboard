# Monitoring & Exception Report (ersetzt die frühere «Signal-Warnung»)
# Zeiten in UTC = Schweizer Winterzeit minus 1 Stunde. Ab der Sommerzeit (28.03.2027) kommen die Mails eine Stunde später.
# GitHub startet geplante Läufe oft 10–30 Minuten verspätet, deshalb ist der Tagesreport auf 6:40 geplant (Ankunft ca. 7:00).
name: Monitoring

on:
  schedule:
    - cron: "5 6-20/2 * * 1-5"   # sofort: Mo–Fr alle 2 Std. von 07:05 bis 21:05
    - cron: "30 21 * * 1-5"      # sofort: nach US-Börsenschluss, 22:30
    - cron: "40 5 * * 1-5"       # Tagesreport: Mo–Fr 6:40 (Ankunft ca. 7:00)
    - cron: "40 5 * * 6"         # Wochenreport: Samstag 6:40
  workflow_dispatch:             # von Hand: Actions → Monitoring → Run workflow
    inputs:
      modus:
        description: "Welcher Lauf?"
        type: choice
        options: [sofort, tag, woche]
        default: tag
      test:
        description: "Nur testen (nichts senden, nichts speichern)"
        type: boolean
        default: true

concurrency:
  group: monitoring          # nie zwei Läufe gleichzeitig (verhindert doppelte Fälle und Mails)
  cancel-in-progress: false

jobs:
  pruefen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: makro-dashboard/makro-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: makro-dashboard/makro-dashboard/requirements.txt
      - run: pip install -r requirements.txt
      - name: Lauf bestimmen
        run: |
          case "${{ github.event.schedule }}" in
            "40 5 * * 1-5") MODUS=tag ;;
            "40 5 * * 6")   MODUS=woche ;;
            *)              MODUS=sofort ;;
          esac
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODUS="${{ inputs.modus }}"
            if [ "${{ inputs.test }}" = "true" ]; then echo "DRY_RUN=1" >> "$GITHUB_ENV"; fi
          fi
          echo "MODUS=$MODUS" >> "$GITHUB_ENV"
          echo "Lauf: $MODUS"
      - run: python monitoring_job.py --$MODUS
        env:
          SCRIPT_URL: ${{ secrets.SCRIPT_URL }}
          SCRIPT_TOKEN: ${{ secrets.SCRIPT_TOKEN }}
          MAIL_EMPFAENGER: ${{ secrets.MAIL_EMPFAENGER }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          APP_URL: ${{ vars.APP_URL || 'https://makro-dashboard-portfolio-sim.streamlit.app' }}
      - name: Test-Mails zum Ansehen bereitstellen
        if: env.DRY_RUN == '1'
        uses: actions/upload-artifact@v4
        with:
          name: test-mails
          path: makro-dashboard/makro-dashboard/monitoring_*.html
          if-no-files-found: ignore
