name: Signal-Warnung

on:
  schedule:
    - cron: "5 6-20/2 * * 1-5"   # Mo–Fr alle 2 Stunden von 07:05 bis 21:05 Schweizer Winterzeit
  workflow_dispatch:              # manuell starten: Actions → Signal-Warnung → Run workflow

jobs:
  pruefen:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: makro-dashboard/makro-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: makro-dashboard/makro-dashboard/requirements.txt
      - run: pip install -r requirements.txt
      - run: python morgenmail.py --warnung
        env:
          SCRIPT_URL: ${{ secrets.SCRIPT_URL }}
          SCRIPT_TOKEN: ${{ secrets.SCRIPT_TOKEN }}
          MAIL_EMPFAENGER: ${{ secrets.MAIL_EMPFAENGER }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          APP_URL: https://makro-dashboard-portfolio-sim.streamlit.app
